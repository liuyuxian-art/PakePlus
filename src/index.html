<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="职镜大学生就业能力诊断与成长服务平台 V1.0：岗位解析、能力诊断、成长计划、能力档案">
  <title>职镜 · 大学生就业能力诊断与成长服务平台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f4fd8'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif'%3E职%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-logo">职镜</div>
    <p class="boot-text">正在加载平台…</p>
  </div>

  <section id="login" class="login" hidden aria-label="登录"></section>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <a class="brand" href="#/jobs" aria-label="职镜首页">
        <span class="logo">职镜</span>
        <span class="brand-sub">
          大学生就业能力诊断与成长服务平台
          <em>V1.0</em>
        </span>
      </a>

      <nav class="steps" id="nav" aria-label="主功能导航">
        <button class="step" data-route="/jobs"><b>01</b>岗位解析</button>
        <button class="step" data-route="/assess"><b>02</b>能力诊断</button>
        <button class="step" data-route="/plan"><b>03</b>成长计划</button>
        <button class="step" data-route="/profile"><b>04</b>能力档案</button>
        <button class="step" data-route="/model"><b>05</b>能力模型</button>
        <button class="step admin-only" data-route="/admin" hidden><b>06</b>后台管理</button>
        <button class="step enterprise-only" data-route="/candidates" hidden><b>06</b>候选人</button>
      </nav>

      <div class="account">
        <span class="avatar" id="avatar">职</span>
        <span class="account-meta">
          <b id="accountName">未登录</b>
          <small id="accountRole">—</small>
        </span>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">退出</button>
      </div>
    </header>

    <main class="main" id="view" tabindex="-1"></main>

    <footer class="footer">
      <span>职镜大学生就业能力诊断与成长服务平台 V1.0</span>
      <span class="dot-sep">·</span>
      <span>演示数据，非真实用户</span>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
